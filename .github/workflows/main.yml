name: CI

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check and build
        required: true
        type: string

jobs:
  check:
    name: Check
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
    - name: Resolve build commit
      id: commit
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Shell Check
      run: ./shellcheck.sh
      shell: bash

  build:
    name: Build
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          arch: x86_64
          os: ubuntu-22.04
          ninja_file: ninja-linux.zip
          ninja_dir: /usr/local/bin
          ninja_sudo: sudo
          rust: stable
          tar: linux
          out_dir: out
        - target: aarch64-unknown-linux-gnu
          arch: aarch64
          os: ubuntu-22.04-arm
          ninja_file: ninja-linux-aarch64.zip
          ninja_dir: /usr/local/bin
          ninja_sudo: sudo
          rust: stable
          tar: linux
          out_dir: out
        - target: aarch64-apple-darwin
          arch: aarch64
          os: macos-latest
          ninja_file: ninja-mac.zip
          ninja_dir: /usr/local/bin
          ninja_sudo: sudo
          rust: stable
          tar: osx
          out_dir: out
        - target: x86_64-apple-darwin
          arch: x86_64
          os: macos-26-intel
          ninja_file: ninja-mac.zip
          ninja_dir: /usr/local/bin
          ninja_sudo: sudo
          rust: stable
          tar: osx
          out_dir: out
        - target: x86_64-pc-windows-msvc
          arch: x86_64
          os: windows-latest
          ninja_file: ninja-win.zip
          ninja_dir: /usr/bin
          ninja_sudo:
          rust: stable
          tar: windows
          out_dir: /c/out
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.check.outputs.sha }}
    - name: Install coreutils and swig
      run: |
        brew update && brew install coreutils swig ninja
      if: matrix.tar == 'osx'
      shell: bash
    - name: Install Linux tools for LLDB
      run: |
        sudo apt-get install build-essential swig python3-dev libedit-dev libncurses5-dev libxml2-dev
      if: matrix.os == 'ubuntu-22.04'
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      if: matrix.os == 'ubuntu-22.04'
      with:
        tool-cache: false
    - name: Install Ninja
      run: |
        curl -L -O "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${{ matrix.ninja_file }}" && \
        ${{ matrix.ninja_sudo }} unzip -o ${{ matrix.ninja_file }} -d ${{ matrix.ninja_dir }} && rm ${{ matrix.ninja_file }}
      if: matrix.tar != 'osx'
      shell: bash
    - name: Install Rust
      uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
      with:
        toolchain: 1.95.0
    - name: Build
      run: ./build.sh ${{ matrix.out_dir }}
      shell: bash
    - name: Upload ${{ matrix.tar }} tarball
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-tools-${{ matrix.tar }}-${{ matrix.arch }}.tar.bz2
        path: platform-tools-${{ matrix.tar }}-${{ matrix.arch }}.tar.bz2
